<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Трансформация вращения</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<header>
			<nav>
				<a href="../../../index.html">На главную</a>
				<a href="../index.html">Назад</a>
			</nav>
		</header>
		<h1>Вращение</h1>
		<div class="description">
			Для вращения элемента применяется свойство
			<code
				>transform: rotate(/*0-180*/deg/*(вращение происходит по часовой
				стрелке)*/);</code
			>
		</div>
		<h2>Примеры</h2>
		<div class="examples">
			<div class="example" id="example1"><code>rotate(0deg)</code></div>
			<div class="example" id="example2"><code>rotate(45deg)</code></div>
			<div class="example" id="example3"><code>rotate(-45deg)</code></div>
			<div class="example" id="example4"><code>rotate(180deg)</code></div>
			<div class="example" id="example5"><code>rotate(90deg)</code></div>
			<div class="example" id="example6"><code>rotate(720deg)</code></div>
		</div>
	</body>
</html>
